<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ukraine War Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/images/favicon.ico">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/images/site.webmanifest">
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-title"></div>
      <button id="sidebar-close">×</button>
    </div>
    <div id="sidebar-updated">Latest reports</div>
    <div id="sidebar-content"></div>
  </div>

  <div id="legend">
    <div class="filter-row">
      <span class="legend-title">Show</span>
      <span class="legend-item filter active" data-filter="all" style="color:#111">All</span>
      <span class="legend-item filter" data-filter="military" style="color:#CC0000">Military</span>
      <span class="legend-item filter" data-filter="diplomatic" style="color:#4A90D9">Diplomatic</span>
      <span class="legend-item filter" data-filter="humanitarian" style="color:#E8A838">Humanitarian</span>
    </div>
    <div class="unlocated-row">
      <span id="unlocated-link" class="unlocated-link">No location: <span id="unlocated-count">…</span> of <span id="unlocated-total">…</span> reports this week</span>
    </div>
    <div class="legend-note">Pin size = reports in the last 7 days. Types are guessed from keywords and may be wrong. Red area = Russian-occupied territory (<a href="https://deepstatemap.live" target="_blank" rel="noopener">DeepState</a> data, <span id="frontline-date">loading</span>).</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="index.js"></script>
</body>
</html>
